name: fvi-env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24.0
  - matplotlib>=3.7.0
  - pillow>=10.0.0
  - pytest>=7.4.0
  - pip:
      - torch>=2.1.0
      - torchvision>=0.16.0
      - fastapi>=0.104.0
      - "uvicorn[standard]>=0.24.0"
      - python-multipart>=0.0.6
      - pydantic>=2.4.0
      - -e .
